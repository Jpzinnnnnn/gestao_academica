<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<div class="page">

 <div class="back" (click)="voltar()">

  <div class="back-icon">
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M19 12H5M5 12l7 7M5 12l7-7"></path>
    </svg>
  </div>

  <span>Voltar</span>

</div>

  <div class="register-card">

    <!-- ALUNO -->
    <ng-container *ngIf="tipo === 'aluno'">

      <div class="header">

        <div class="icon-box blue">
          <i class="fa-solid fa-graduation-cap icon"></i>
        </div>

        <div>
          <h1>Registro do Aluno</h1>
          <p>Crie sua conta</p>
        </div>

      </div>

      <form (submit)="registrar($event)">

        <div class="input-group">

          <label>Digite seu login (RA)</label>

          <input
            type="text"
            placeholder="RA12345"
            [(ngModel)]="ra"
            name="ra"
          />

        </div>

        <div class="input-group">

          <label>Digite seu email</label>

          <input
            type="email"
            placeholder="email"
            [(ngModel)]="email"
            name="email"
          />

        </div>

        <div class="input-group">

          <label>Digite seu nome</label>

          <input
            type="text"
            placeholder="nome"
            [(ngModel)]="nome"
            name="nome"
          />

        </div>

        <div class="input-group">

          <label>Digite sua senha</label>

          <input
            type="password"
            placeholder="••••••••"
            [(ngModel)]="senha"
            name="senha"
          />

        </div>

        <div class="input-group">

          <label>Confirme sua senha</label>

          <input
            type="password"
            placeholder="••••••••"
            [(ngModel)]="confirmar"
            name="confirmar"
          />

          <div class="erro" *ngIf="erro">
            {{ erro }}
          </div>

        </div>

        <button
          type="submit"
          [disabled]="carregando"
        >
          {{ carregando ? 'Registrando...' : 'Registrar' }}
        </button>

      </form>

    </ng-container>

   <!-- PROFESSOR -->
<ng-container *ngIf="tipo === 'professor'">

  <div class="header">

    <div class="icon-box purple">
      <i class="fa-solid fa-chalkboard-user icon"></i>
    </div>

    <div>
      <h1>Registro do Professor</h1>
      <p>Crie sua conta</p>
    </div>

  </div>

  <form (submit)="registrar($event)">

    <div class="input-group">

      <label>Digite seu CPF</label>

      <input
        type="text"
        placeholder="000.000.000-00"
        [(ngModel)]="cpf"
        name="cpf"
      />

    </div>

    <div class="input-group">

      <label>Digite seu nome</label>

      <input
        type="text"
        placeholder="Nome completo"
        [(ngModel)]="nome"
        name="nome"
      />

    </div>

    <div class="input-group">

      <label>Digite sua senha</label>

      <input
        type="password"
        placeholder="••••••••"
        [(ngModel)]="senha"
        name="senha"
      />

    </div>

    <div class="input-group">

      <label>Confirme sua senha</label>

      <input
        type="password"
        placeholder="••••••••"
        [(ngModel)]="confirmar"
        name="confirmar"
      />

      <div class="erro" *ngIf="erro">
        {{ erro }}
      </div>

    </div>

    <button
      type="submit"
      [disabled]="carregando"
    >
      {{ carregando ? 'Registrando...' : 'Registrar' }}
    </button>

  </form>

</ng-container>
