<div class="page">

  <div class="back" (click)="voltar()">
    <span class="arrow">←</span>
    <span>Voltar</span>
  </div>

  <div class="login-card">

    <div class="header">

      <div
      class="icon-box"
      [class.blue]="tipo === 'aluno'"
      [class.purple]="tipo === 'professor'"
    >
    <i
    [class]="
      tipo === 'aluno'
      ? 'icon fa-solid fa-graduation-cap'
      : 'icon fa-solid fa-chalkboard-user'
    "
  ></i>

      </div>

      <div>
        <h1>
          {{
            tipo === 'aluno'
            ? 'Login do Aluno'
            : 'Login do Professor'
          }}
        </h1>

        <p>Entre com suas credenciais</p>
      </div>

    </div>

    <form (ngSubmit)="login()">

      <div class="input-group">

        <label>
          {{
            tipo === 'aluno'
            ? 'Digite seu login (RA)'
            : 'Digite seu login (CPF)'
          }}
        </label>

        <input
          type="text"
          [placeholder]="
            tipo === 'aluno'
            ? 'RA12345'
            : '000.000.000-00'
          "
          [(ngModel)]="ra"
          name="ra"
        />

      </div>

      <div class="input-group">

        <label>Digite sua senha</label>

        <input
          type="password"
          placeholder="••••••••"
          [(ngModel)]="senha"
          name="senha"
        />

      </div>

      <button type="submit">
        Entrar
      </button>

    </form>

    <div class="register">
      Não tem uma conta?
      <a (click)="irParaRegistro()">
        Registre-se
      </a>
    </div>

  </div>

</div>
