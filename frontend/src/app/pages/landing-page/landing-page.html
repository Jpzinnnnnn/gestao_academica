<div class="container">

  <!-- LADO ESQUERDO -->
  <div class="left">

    <h1>GEA</h1>

    <h2>Gestão Escolar Acadêmica</h2>

    <p>
      Bem-vindo ao sistema de gestão escolar.
      Acesse sua conta para gerenciar suas
      atividades acadêmicas.
    </p>

  </div>

  <!-- LADO DIREITO -->
  <div class="right">

    <!-- CARD ALUNO -->
    <div class="card" (click)="acessarAluno()">

      <div class="icon blue">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>

      <div class="text">
        <h3>Sou Estudante</h3>
        <span>Acessar como aluno</span>
      </div>

    </div>

    <!-- CARD PROFESSOR -->
    <div class="card" (click)="acessarProfessor()">

      <div class="icon purple">
        <i class="fa-regular fa-user"></i>
      </div>

      <div class="text">
        <h3>Sou Professor</h3>
        <span>Acessar como professor</span>
      </div>

    </div>

  </div>

</div>
